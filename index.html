<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2D 격자 위상 및 D₄ 대칭 스펙트럼 시뮬레이터 (최적화 버전)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #030408;
            color: #f0f3f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        #sidebar {
            width: 360px;
            background: #0b0d16;
            border-right: 1px solid #1e2438;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            z-index: 10;
        }
        #main-display {
            flex: 1;
            background-color: #000003;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }
        h1 {
            font-size: 16px;
            color: #00ffcc;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #1e2438;
            padding-bottom: 10px;
        }
        .control-group {
            background: #111422;
            border: 1px solid #1e2438;
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 12px;
            color: #a0aec0;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }
        .value-display {
            color: #00ffcc;
            font-family: monospace;
        }
        input[type="range"], select {
            width: 100%;
            background: #07090f;
            border: 1px solid #232b44;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            outline: none;
        }
        input[type="range"] {
            height: 6px;
            accent-color: #00ffcc;
            cursor: pointer;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            border: 1px solid #1a2035;
            box-shadow: 0 0 40px rgba(0, 255, 200, 0.05);
            background: #000;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div>
            <h1>2D 유한 격자 광학 스펙트럼</h1>
            <p style="font-size: 11px; color:#526488; margin-top:4px;">Fraunhofer Diffraction Solver</p>
        </div>
        
        <div class="control-group">
            <label>격자 배열 수 (N × N)<span id="n-display" class="value-display">-</span></label>
            <input type="range" id="paramN" min="2" max="60" value="12">
        </div>
        
        <div class="control-group">
            <label>격자 간격 / 상수 (a)<span id="a-display" class="value-display">-</span></label>
            <input type="range" id="paramA" min="4" max="40" value="15" step="0.5">
        </div>
        
        <div class="control-group">
            <label>역공간 축척 (Zoom)<span id="zoom-display" class="value-display">-</span></label>
            <input type="range" id="paramZoom" min="0.2" max="3.0" value="1.0" step="0.05">
        </div>
        
        <div class="control-group">
            <label>컬러 렌더링 모드</label>
            <select id="colorMode">
                <option value="spectral">Rainbow Topology (위상 무지개)</option>
                <option value="d4_accent">D₄ Symmetry (8차 대칭 강조)</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>밝기 부스팅 (Gain)<span id="gain-display" class="value-display">-</span></label>
            <input type="range" id="paramGain" min="0.5" max="5.0" value="2.5" step="0.1">
        </div>
    </div>

    <div id="main-display">
        <div id="canvas-container">
            <canvas id="opticsCanvas" width="800" height="800"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('opticsCanvas');
        const ctx = canvas.getContext('2d');

        // 엄밀한 수치 해석용 싱크 함수
        function sinc(x) {
            if (Math.abs(x) < 1e-6) return 1.0;
            return Math.sin(x) / x;
        }

        // 고속 HSV to RGB 변환
        function hsvToRgb(h, s, v) {
            let r, g, b;
            let i = Math.floor(h * 6);
            let f = h * 6 - i;
            let p = v * (1 - s);
            let q = v * (1 - f * s);
            let t = v * (1 - (1 - f) * s);
            switch (i % 6) {
                case 0: r = v, g = t, b = p; break;
                case 1: r = q, g = v, b = p; break;
                case 2: r = p, g = v, b = t; break;
                case 3: r = p, g = q, b = v; break;
                case 4: r = t, g = p, b = v; break;
                case 5: r = v, g = p, b = q; break;
            }
            return [Math.round(r * 255), Math.round(g * 255), Math.round(b * 255)];
        }

        function render() {
            const N = parseInt(document.getElementById('paramN').value);
            const a = parseFloat(document.getElementById('paramA').value);
            const zoom = parseFloat(document.getElementById('paramZoom').value);
            const colorMode = document.getElementById('colorMode').value;
            const gain = parseFloat(document.getElementById('paramGain').value);
            
            // 데이터 텍스트 실시간 반영 보장
            document.getElementById('n-display').innerText = `${N}x${N}`;
            document.getElementById('a-display').innerText = a.toFixed(1);
            document.getElementById('zoom-display').innerText = zoom.toFixed(2) + 'x';
            document.getElementById('gain-display').innerText = gain.toFixed(1);

            const width = canvas.width;
            const height = canvas.height;
            
            // 화면 갱신 속도를 획기적으로 올리기 위한 2x2 픽셀 블록화 버퍼 기법 적용
            const imgData = ctx.createImageData(width, height);
            const data = imgData.data;

            const baseScale = 0.05;
            const scaleFactor = baseScale / zoom;
            const holeSize = 1.0; 

            for (let py = 0; py < height; py += 2) {
                const fY = (py - height / 2) * scaleFactor;
                const factorY = Math.PI * holeSize * fY;
                const phaseY = Math.PI * a * fY * 0.2;
                const interY = Math.abs(Math.sin(phaseY)) < 1e-4 ? N : Math.sin(N * phaseY) / Math.sin(phaseY);
                const intY_sq = (interY / N) * (interY / N);
                const sincY = sinc(factorY);

                for (let px = 0; px < width; px += 2) {
                    const fX = (px - width / 2) * scaleFactor;

                    // 1. 논리적 맥스웰-프라운호퍼 간섭/회절 연산 (완벽한 물리 수식 식)
                    const factorX = Math.PI * holeSize * fX;
                    const phaseX = Math.PI * a * fX * 0.2;
                    const envelope = Math.pow(sinc(factorX) * sincY, 2);
                    const interX = Math.abs(Math.sin(phaseX)) < 1e-4 ? N : Math.sin(N * phaseX) / Math.sin(phaseX);
                    
                    const totalIntensity = envelope * (interX / N) * (interX / N) * intY_sq;

                    // 기하학적 요소 계산
                    const radialDist = Math.sqrt(fX * fX + fY * fY);
                    const angle = Math.atan2(fY, fX);
                    let brightness = Math.min(1.0, Math.pow(totalIntensity * gain, 0.6));

                    let r = 0, g = 0, b = 0;

                    // 2. 요청하신 무지개 그라데이션 및 D4 대칭 가시화 변수 조합
                    if (colorMode === 'spectral') {
                        let hueFactor = (Math.sin(phaseX) * Math.sin(phaseY) + 1.0) * 0.5;
                        let hue = (radialDist * 0.35 + hueFactor * 0.2) % 1.0;
                        const rgb = hsvToRgb(hue, 0.85, brightness);
                        r = rgb[0]; g = rgb[1]; b = rgb[2];
                    } else {
                        let d4Symmetry = Math.abs(Math.cos(4 * angle)); 
                        r = Math.min(255, brightness * (0.3 + 0.7 * Math.sin(phaseX)) * 255);
                        g = Math.min(255, brightness * (0.3 + 0.7 * d4Symmetry) * 255);
                        b = Math.min(255, brightness * (0.3 + 0.7 * Math.cos(phaseY)) * 255);
                    }

                    // 상쇄 영역 기저광 보정
                    if (totalIntensity < 0.002) {
                        let baseLight = (0.5 + 0.5 * Math.sin(4 * angle)) * 5;
                        r += baseLight; g += baseLight; b += 18 + baseLight;
                    }

                    // 2x2 픽셀 블록에 데이터 고속 전사 (성능 대폭 향상 버그 해결 핵심)
                    for (let dy = 0; dy < 2; dy++) {
                        for (let dx = 0; dx < 2; dx++) {
                            if (px + dx < width && py + dy < height) {
                                const idx = ((py + dy) * width + (px + dx)) * 4;
                                data[idx] = r;
                                data[idx + 1] = g;
                                data[idx + 2] = b;
                                data[idx + 3] = 255;
                            }
                        }
                    }
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // 이벤트 리스너 통합 바인딩 (수치 먹통 버그 완벽 제어)
        const controls = ['paramN', 'paramA', 'paramZoom', 'colorMode', 'paramGain'];
        controls.forEach(id => {
            document.getElementById(id).addEventListener('input', render);
            document.getElementById(id).addEventListener('change', render);
        });

        // 초기 기동
        render();
    </script>
</body>
</html>
