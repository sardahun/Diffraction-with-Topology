<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2D 격자 위상 및 회절 시뮬레이터 (T² vs 유한 격자)</title>
    <style>
        body {
            margin: 0;
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #controls {
            background: rgba(20, 20, 20, 0.9);
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 15px;
            border: 1px solid #333;
            z-index: 10;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
        }
        select, input {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            outline: none;
        }
        input[type="range"] {
            padding: 0;
            width: 120px;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 0 40px rgba(0, 255, 150, 0.1);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #222;
        }
        canvas {
            display: block;
            background: #000;
        }
    </style>
</head>
<body>

    <div id="controls">
        <div class="control-group">
            <label>경계 조건 (Boundary)</label>
            <select id="mode" onchange="updateSimulation()">
                <option value="finite">유한 격자 (Finite Lattice)</option>
                <option value="infinite">무한 격자 (Infinite Torus T²)</option>
            </select>
        </div>
        <div class="control-group" id="grid-size-group">
            <label>격자 크기 (N x N): <span id="n-val">7</span></label>
            <input type="range" id="latticeN" min="2" max="25" value="7" step="1" oninput="updateSimulation()">
        </div>
        <div class="control-group">
            <label>파장 (Wavelength)</label>
            <input type="range" id="wavelength" min="400" max="700" value="532" step="10" oninput="updateSimulation()">
        </div>
        <div class="control-group">
            <label>격자 상수 (a)</label>
            <input type="range" id="latticeA" min="10" max="50" value="30" step="1" oninput="updateSimulation()">
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="diffractionCanvas" width="600" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('diffractionCanvas');
        const ctx = canvas.getContext('2d');

        // Sinc 함수 정의 (정밀한 회절 수식용)
        function sinc(x) {
            if (Math.abs(x) < 1e-8) return 1.0;
            return Math.sin(x) / x;
        }

        // 역공간 주파수 및 위상차를 조화 함수 기반 RGB 채널로 인코딩하는 무지개 매핑 함수
        function phaseToRainbowRGB(amplitude, x, y) {
            // 파동의 각도(위상 반전 각도 계산 변수) 추출
            // 중심으로부터의 주파수 반경(r)과 공간 구조 반영
            const r = Math.sqrt(x*x + y*y);
            const angle = Math.atan2(y, x);

            // 보고서의 '위상 반전(Phase Flip)' 구현: 
            // 복소 진폭 부호(Sign)가 음수(-)로 바뀔 때 위상을 180도(pi) 회전 가산
            let basePhase = r * 1.8 + angle;
            if (amplitude < 0) {
                basePhase += Math.PI; 
            }

            // RGB 가법 혼색 스펙트럼 인코딩 (무지개 그라데이션)
            const rChannel = Math.sin(basePhase) * 127 + 128;
            const gChannel = Math.sin(basePhase + (2 * Math.PI / 3)) * 127 + 128;
            const bChannel = Math.sin(basePhase + (4 * Math.PI / 3)) * 127 + 128;

            return { r: rChannel, g: gChannel, b: bChannel };
        }

        function updateSimulation() {
            const mode = document.getElementById('mode').value;
            const N = parseInt(document.getElementById('latticeN').value);
            const wl = parseFloat(document.getElementById('wavelength').value);
            const a = parseFloat(document.getElementById('latticeA').value);
            
            document.getElementById('n-val').innerText = N;
            
            const nGroup = document.getElementById('grid-size-group');
            if (mode === 'infinite') {
                nGroup.style.opacity = '0.3';
                nGroup.style.pointerEvents = 'none';
            } else {
                nGroup.style.opacity = '1';
                nGroup.style.pointerEvents = 'auto';
            }

            const width = canvas.width;
            const height = canvas.height;
            const imgData = ctx.createImageData(width, height);
            
            // 물리 상수 및 스케일링 설정
            const holeSize = a * 0.4; // 격자 안의 정사각형 구멍 크기 (b)

            for (let py = 0; py < height; py++) {
                const y = (py - height / 2) * 0.1; 

                for (let px = 0; px < width; px++) {
                    const x = (px - width / 2) * 0.1;

                    let intensity = 0;
                    let totalAmp = 0; // 부호 추적용 복소 진폭 변수 추가

                    // 1. 단일 구멍에 의한 프라운호퍼 회절 (Envelope function)
                    const factorX = (Math.PI * holeSize * x) / (wl * 0.1);
                    const factorY = (Math.PI * holeSize * y) / (wl * 0.1);
                    const singleAmp = sinc(factorX) * sinc(factorY);

                    if (mode === 'finite') {
                        // 2-A. 유한 격자: 다중 슬릿 상쇄/보강 간섭 수학식 (부호 보존)
                        const phaseX = (Math.PI * a * x) / (wl * 0.1);
                        const phaseY = (Math.PI * a * y) / (wl * 0.1);
                        
                        const interferenceX = Math.abs(Math.sin(phaseX)) < 1e-5 ? N : Math.sin(N * phaseX) / Math.sin(phaseX);
                        const interferenceY = Math.abs(Math.sin(phaseY)) < 1e-5 ? N : Math.sin(N * phaseY) / Math.sin(phaseY);
                        
                        // 제곱을 취하기 전, 진폭의 극성(+/-) 정보를 온전히 담음
                        totalAmp = singleAmp * (interferenceX / N) * (interferenceY / N);
                        intensity = Math.pow(totalAmp, 2);

                    } else {
                        // 2-B. 무한 격자 (T² 위상 구조): 라우에 조건에 위상 인코딩 동기화
                        const unitX = (x * a) / (wl * 0.1);
                        const unitY = (y * a) / (wl * 0.1);
                        
                        const deltaX = Math.abs(unitX - Math.round(unitX));
                        const deltaY = Math.abs(unitY - Math.round(unitY));
                        
                        if (deltaX < 0.08 && deltaY < 0.08) {
                            const peakX = Math.exp(-Math.pow(deltaX/0.03, 2));
                            const peakY = Math.exp(-Math.pow(deltaY/0.03, 2));
                            totalAmp = singleAmp * peakX * peakY;
                            intensity = Math.pow(totalAmp, 2);
                        } else {
                            totalAmp = 0;
                            intensity = 0;
                        }
                    }

                    // 밝기(Intensity) 스케일링 및 감마 보정
                    const brightness = Math.min(1, intensity * 2.2); 
                    
                    // 핵심: 진폭의 극성 정보와 좌표 역공간 변수를 기반으로 무지개 색상 변환
                    const rainbowColor = phaseToRainbowRGB(totalAmp, x, y);

                    // 스크린 픽셀 색상 대입
                    const idx = (py * width + px) * 4;
                    imgData.data[idx] = Math.pow(brightness, 0.7) * rainbowColor.r;     // R
                    imgData.data[idx + 1] = Math.pow(brightness, 0.7) * rainbowColor.g; // G
                    imgData.data[idx + 2] = Math.pow(brightness, 0.7) * rainbowColor.b; // B
                    imgData.data[idx + 3] = 255;                                      // Alpha
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // 초기 실행
        updateSimulation();
    </script>
</body>
</html>
