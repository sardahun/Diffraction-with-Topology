<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>정밀 2D 격자 위상 및 간섭 스펙트럼 시뮬레이터</title>
    <style>
        body {
            margin: 0;
            background-color: #030303;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #controls {
            background: rgba(15, 15, 15, 0.95);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.7);
            display: flex;
            gap: 25px;
            align-items: center;
            margin-bottom: 15px;
            border: 1px solid #292929;
            z-index: 10;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00ffcc;
            font-weight: bold;
        }
        select, input {
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
        }
        input[type="range"] {
            padding: 0;
            width: 140px;
            accent-color: #00ffcc;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 255, 200, 0.15);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #222;
        }
        canvas {
            display: block;
            background: #000;
        }
    </style>
</head>
<body>

    <div id="controls">
        <div class="control-group">
            <label>경계 조건 (Boundary)</label>
            <select id="mode" onchange="updateSimulation()">
                <option value="finite">유한 격자 (Finite Lattice)</option>
                <option value="infinite">무한 격자 (Infinite Torus T²)</option>
            </select>
        </div>
        <div class="control-group" id="grid-size-group">
            <label>격자 대형 수 (N x N): <span id="n-val">15</span></label>
            <input type="range" id="latticeN" min="2" max="80" value="15" step="1" oninput="updateSimulation()">
        </div>
        <div class="control-group">
            <label>격자 간격 (a)</label>
            <input type="range" id="latticeA" min="2" max="30" value="10" step="0.5" oninput="updateSimulation()">
        </div>
        <div class="control-group">
            <label>스펙트럼 감도 (Gain)</label>
            <input type="range" id="gain" min="0.5" max="5" value="2.5" step="0.1" oninput="updateSimulation()">
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="diffractionCanvas" width="700" height="700"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('diffractionCanvas');
        const ctx = canvas.getContext('2d');

        // 엄밀한 전자기파 회절 수식 계산용 싱크 함수
        function sinc(x) {
            if (Math.abs(x) < 1e-8) return 1.0;
            return Math.sin(x) / x;
        }

        function updateSimulation() {
            const mode = document.getElementById('mode').value;
            const N = parseInt(document.getElementById('latticeN').value);
            const a = parseFloat(document.getElementById('latticeA').value);
            const gain = parseFloat(document.getElementById('gain').value);
            
            document.getElementById('n-val').innerText = `${N}x${N}`;
            
            // 무한 격자 모드일 때는 N 조절 비활성화
            const nGroup = document.getElementById('grid-size-group');
            if (mode === 'infinite') {
                nGroup.style.opacity = '0.2';
                nGroup.style.pointerEvents = 'none';
            } else {
                nGroup.style.opacity = '1';
                nGroup.style.pointerEvents = 'auto';
            }

            const width = canvas.width;
            const height = canvas.height;
            const imgData = ctx.createImageData(width, height);
            
            // 격자 구멍 비율 안정화
            const holeSize = a * 0.4; 

            // 격자 상수(a)에 반비례하여 화면 배율이 최적화되도록 스케일 팩터 동적 계산 (중요!)
            // 이 수식 덕분에 a가 작아져도 무늬가 화면 밖으로 터지지 않고 완벽한 크기를 유지합니다.
            const scaleFactor = 0.25 / a; 

            for (let py = 0; py < height; py++) {
                // 중심이 (0,0)인 2차원 상호 공간 주파수(f) 성분 매핑
                const fY = (py - height / 2) * scaleFactor; 

                for (let px = 0; px < width; px++) {
                    const fX = (px - width / 2) * scaleFactor;

                    // 1. 단일 정사각형 구멍에 의한 X, Y축 회절 포발선 (Envelope)
                    const factorX = Math.PI * holeSize * fX;
                    const factorY = Math.PI * holeSize * fY;
                    const envelope = Math.pow(sinc(factorX) * sinc(factorY), 2);

                    let intensityX = 0;
                    let intensityY = 0;
                    let totalIntensity = 0;

                    // 2차원 간섭 무늬 주기를 결정하는 X, Y 위상 변수
                    const phaseX = Math.PI * a * fX;
                    const phaseY = Math.PI * a * fY;

                    if (mode === 'finite') {
                        // [유한 격자 복사 조건] 맥스웰-프라운호퍼 간섭 정밀 수식
                        const interX = Math.abs(Math.sin(phaseX)) < 1e-5 ? N : Math.sin(N * phaseX) / Math.sin(phaseX);
                        const interY = Math.abs(Math.sin(phaseY)) < 1e-5 ? N : Math.sin(N * phaseY) / Math.sin(phaseY);
                        
                        intensityX = Math.pow(interX / N, 2);
                        intensityY = Math.pow(interY / N, 2);
                        totalIntensity = envelope * intensityX * intensityY;
                    } else {
                        // [무한 격자 조건] Torus(T²) 상의 이산 고대칭 지점 라우에(Laue) 정수 조건식
                        const deltaX = Math.abs(fX * a - Math.round(fX * a));
                        const deltaY = Math.abs(fY * a - Math.round(fY * a));
                        
                        // 완벽한 위상 불변 점들의 윤곽을 선명하게 픽킹
                        if (deltaX < 0.15 && deltaY < 0.15) {
                            intensityX = Math.exp(-Math.pow(deltaX/0.05, 2));
                            intensityY = Math.exp(-Math.pow(deltaY/0.05, 2));
                            totalIntensity = envelope * intensityX * intensityY;
                        }
                    }

                    const idx = (py * width + px) * 4;

                    // [X, Y축 간섭 위상차를 R, G, B 독립 채널에 매핑하여 알록달록한 스펙트럼 생성]
                    let r_comp = totalIntensity * (0.5 + 0.5 * Math.sin(phaseX));
                    let g_comp = totalIntensity * (0.5 + 0.5 * Math.cos(phaseY));
                    let b_comp = totalIntensity * (0.5 + 0.5 * Math.sin(phaseX + phaseY));

                    // 감도(Gain) 및 인간의 시각 특성 감마 보정
                    let r = Math.min(255, Math.pow(r_comp * gain, 0.7) * 255);
                    let g = Math.min(255, Math.pow(g_comp * gain, 0.7) * 255);
                    let b = Math.min(255, Math.pow(b_comp * gain, 0.7) * 255);

                    // 완전 소멸 지점(Extinction / 위상학적 특이점)의 기하학적 형태를 추적하기 위한 미세 배경광
                    if (totalIntensity < 0.002) {
                        r += 10; g += 7; b += 22; 
                    }

                    imgData.data[idx] = r;
                    imgData.data[idx + 1] = g;
                    imgData.data[idx + 2] = b;
                    imgData.data[idx + 3] = 255;
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // 시뮬레이터 즉시 구동
        updateSimulation();
    </script>
</body>
</html>
