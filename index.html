<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>고해상도 2D 격자 위상 및 간섭 스펙트럼 시뮬레이터</title>
    <style>
        body {
            margin: 0;
            background-color: #030303;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #controls {
            background: rgba(15, 15, 15, 0.95);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.7);
            display: flex;
            gap: 25px;
            align-items: center;
            margin-bottom: 15px;
            border: 1px solid #292929;
            z-index: 10;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00ffcc;
            font-weight: bold;
        }
        select, input {
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
        }
        input[type="range"] {
            padding: 0;
            width: 140px;
            accent-color: #00ffcc;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 255, 200, 0.15);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #222;
        }
        canvas {
            display: block;
            background: #000;
        }
    </style>
</head>
<body>

    <div id="controls">
        <div class="control-group">
            <label>경계 조건 (Boundary)</label>
            <select id="mode" onchange="updateSimulation()">
                <option value="finite">유한 격자 (Finite Lattice)</option>
                <option value="infinite">무한 격자 (Infinite Torus T²)</option>
            </select>
        </div>
        <div class="control-group" id="grid-size-group">
            <label>격자 대형 수 (N x N): <span id="n-val">15</span></label>
            <input type="range" id="latticeN" min="2" max="80" value="15" step="1" oninput="updateSimulation()">
        </div>
        <div class="control-group">
            <label>격자 간격 (a)</label>
            <input type="range" id="latticeA" min="2" max="30" value="12" step="0.5" oninput="updateSimulation()">
        </div>
        <div class="control-group">
            <label>스펙트럼 감도 (Gain)</label>
            <input type="range" id="gain" min="0.5" max="5" value="2" step="0.1" oninput="updateSimulation()">
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="diffractionCanvas" width="700" height="700"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('diffractionCanvas');
        const ctx = canvas.getContext('2d');

        // 엄밀한 수식 연산을 위한 Sinc 함수
        function sinc(x) {
            if (Math.abs(x) < 1e-8) return 1.0;
            return Math.sin(x) / x;
        }

        function updateSimulation() {
            const mode = document.getElementById('mode').value;
            const N = parseInt(document.getElementById('latticeN').value);
            const a = parseFloat(document.getElementById('latticeA').value);
            const gain = parseFloat(document.getElementById('gain').value);
            
            document.getElementById('n-val').innerText = `${N}x${N}`;
            
            const nGroup = document.getElementById('grid-size-group');
            if (mode === 'infinite') {
                nGroup.style.opacity = '0.2';
                nGroup.style.pointerEvents = 'none';
            } else {
                nGroup.style.opacity = '1';
                nGroup.style.pointerEvents = 'auto';
            }

            const width = canvas.width;
            const height = canvas.height;
            const imgData = ctx.createImageData(width, height);
            
            // 물리 스케일링 상수 설정
            const wl_ref = 0.5; // 기준 등가 파장
            const holeSize = a * 0.35; // 격자점 자체의 구멍 크기 (b)

            for (let py = 0; py < height; py++) {
                // 중심이 (0,0)인 상호 공간 좌표계 전사
                const y = (py - height / 2) * 0.02; 

                for (let px = 0; px < width; px++) {
                    const x = (px - width / 2) * 0.02;

                    // 1. 단일 슬릿에 의한 포발선 함수 (Envelope)
                    const factorX = Math.PI * holeSize * x;
                    const factorY = Math.PI * a * x;
                    const envelope = Math.pow(sinc(factorX) * sinc(factorY), 2);

                    let intensityX = 0;
                    let intensityY = 0;
                    let totalIntensity = 0;

                    // 고주파 알록달록한 위상 무늬 생성을 위한 주파수 성분 변수화
                    const phaseX = Math.PI * a * x;
                    const phaseY = Math.PI * a * y;

                    if (mode === 'finite') {
                        // 2-A. 유한 격자: 다중 슬릿 간섭 정밀식
                        const interX = Math.abs(Math.sin(phaseX)) < 1e-5 ? N : Math.sin(N * phaseX) / Math.sin(phaseX);
                        const interY = Math.abs(Math.sin(phaseY)) < 1e-5 ? N : Math.sin(N * phaseY) / Math.sin(phaseY);
                        
                        intensityX = Math.pow(interX / N, 2);
                        intensityY = Math.pow(interY / N, 2);
                        totalIntensity = envelope * intensityX * intensityY;
                    } else {
                        // 2-B. 무한 격자 (T² 위상 공간): 이산 고대칭 지점 Laue 조건 해석
                        const unitX = (x * a);
                        const unitY = (y * a);
                        
                        const deltaX = Math.abs(unitX - Math.round(unitX));
                        const deltaY = Math.abs(unitY - Math.round(unitY));
                        
                        if (deltaX < 0.08 && deltaY < 0.08) {
                            intensityX = Math.exp(-Math.pow(deltaX/0.03, 2));
                            intensityY = Math.exp(-Math.pow(deltaY/0.03, 2));
                            totalIntensity = envelope * intensityX * intensityY;
                        }
                    }

                    // 픽셀 인덱스 계산
                    const idx = (py * width + px) * 4;

                    // [알록달록한 위상 간섭 무늬 변수 지정]
                    // 빛의 세기(totalIntensity)뿐만 아니라, 공간 좌표의 간섭 주기(phase) 자체를 색상 정보에 대입
                    // 이를 통해 하나의 무늬 안에서도 보강/상쇄 간섭 경계가 등고선처럼 다채로운 색으로 분리됨
                    let r_comp = totalIntensity * (0.5 + 0.5 * Math.sin(phaseX));
                    let g_comp = totalIntensity * (0.5 + 0.5 * Math.cos(phaseY));
                    let b_comp = totalIntensity * (0.5 + 0.5 * Math.sin(phaseX + phaseY));

                    // 전체 Gain 및 감마(보정) 처리
                    let r = Math.min(255, Math.pow(r_comp * gain, 0.7) * 255);
                    let g = Math.min(255, Math.pow(g_comp * gain, 0.7) * 255);
                    let b = Math.min(255, Math.pow(b_comp * gain, 0.7) * 255);

                    // 완전히 어두운 곳(Extinction 지점)의 기하학적 윤곽을 보기 좋게 만들기 위한 베이스 휘도 추가
                    if (totalIntensity < 0.005) {
                        r += 5; g += 5; b += 15; // 미세한 심해 청색 베이스로 구조 가시화
                    }

                    imgData.data[idx] = r;
                    imgData.data[idx + 1] = g;
                    imgData.data[idx + 2] = b;
                    imgData.data[idx + 3] = 255;
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // 초기 구동
        updateSimulation();
    </script>
</body>
</html>
