<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2D 격자 위상 및 회절 시뮬레이터 (T² vs 유한 격자)</title>
    <style>
        body {
            margin: 0;
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #controls {
            background: rgba(20, 20, 20, 0.9);
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 15px;
            border: 1px solid #333;
            z-index: 10;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
        }
        select, input {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            outline: none;
        }
        input[type="range"] {
            padding: 0;
            width: 120px;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 0 40px rgba(0, 255, 150, 0.1);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #222;
        }
        canvas {
            display: block;
            background: #000;
        }
    </style>
</head>
<body>

    <div id="controls">
        <div class="control-group">
            <label>경계 조건 (Boundary)</label>
            <select id="mode" onchange="updateSimulation()">
                <option value="finite">유한 격자 (Finite Lattice)</option>
                <option value="infinite">무한 격자 (Infinite Torus T²)</option>
            </select>
        </div>
        <div class="control-group" id="grid-size-group">
            <label>격자 크기 (N x N): <span id="n-val">7</span></label>
            <input type="range" id="latticeN" min="2" max="25" value="7" step="1" oninput="updateSimulation()">
        </div>
        <div class="control-group">
            <label>파장 (Wavelength)</label>
            <input type="range" id="wavelength" min="400" max="700" value="532" step="10" oninput="updateSimulation()">
        </div>
        <div class="control-group">
            <label>격자 상수 (a)</label>
            <input type="range" id="latticeA" min="10" max="50" value="30" step="1" oninput="updateSimulation()">
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="diffractionCanvas" width="600" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('diffractionCanvas');
        const ctx = canvas.getContext('2d');

        // Sinc 함수 정의
        function sinc(x) {
            if (Math.abs(x) < 1e-8) return 1.0;
            return Math.sin(x) / x;
        }

        // 보고서 기반: 고대칭점 간섭 중첩도 및 위상에 따른 정밀 무지개 매핑
        // 회오리를 제거하고 소실점(Extinction Line) 기준 거리에 따라 대칭적으로 변조되도록 수정
        function calculatePhysicalColor(totalAmp, phaseX, phaseY) {
            [span_4](start_span)// 복소 진폭의 부호(Sign) 추적 -> 위상 반전(Phase Flip, pi 라디안 변동) 매핑[span_4](end_span)
            let basePhase = (phaseX + phaseY); 
            if (totalAmp < 0) {
                basePhase += Math.PI; [span_5](start_span)// 소멸선을 경계로 보색 극성 반전[span_5](end_span)
            }

            // 공간 주파수 간섭 무늬의 방향성 및 거리에 따른 주기적 색상 배치
            const r = Math.sin(basePhase) * 127 + 128;
            const g = Math.sin(basePhase + (2 * Math.PI / 3)) * 127 + 128;
            const b = Math.sin(basePhase + (4 * Math.PI / 3)) * 127 + 128;

            return { r, g, b };
        }

        function updateSimulation() {
            const mode = document.getElementById('mode').value;
            const N = parseInt(document.getElementById('latticeN').value);
            const wl = parseFloat(document.getElementById('wavelength').value);
            const a = parseFloat(document.getElementById('latticeA').value);
            
            document.getElementById('n-val').innerText = N;
            
            const nGroup = document.getElementById('grid-size-group');
            if (mode === 'infinite') {
                nGroup.style.opacity = '0.3';
                nGroup.style.pointerEvents = 'none';
            } else {
                nGroup.style.opacity = '1';
                nGroup.style.pointerEvents = 'auto';
            }

            const width = canvas.width;
            const height = canvas.height;
            const imgData = ctx.createImageData(width, height);
            
            // 물리 스케일링 전면 수정: N 증가 시 무늬가 작아지기만 하던 오류 해결
            [span_6](start_span)// 화면 픽셀을 물리적 공간 주파수(f_X, f_Y) 영역으로 정규화 매핑[span_6](end_span)
            const k_constant = 0.005 * (wl / 532); // 파장별 스케일 보정
            const holeSize = a * 0.35; [span_7](start_span)// 격자 내 정사각형 구멍 크기 (b)[span_7](end_span)

            for (let py = 0; py < height; py++) {
                [span_8](start_span)// 원점 Gamma(0,0) 중심 좌표계 설정[span_8](end_span)
                const f_Y = (py - height / 2) * k_constant; 

                for (let px = 0; px < width; px++) {
                    const f_X = (px - width / 2) * k_constant;

                    let intensity = 0;
                    let totalAmp = 0;

                    [span_9](start_span)// 1. 단일 구멍에 의한 프라운호퍼 회절 포발선 (Envelope Function)[span_9](end_span)
                    const envelopeX = Math.PI * holeSize * f_X;
                    const envelopeY = Math.PI * holeSize * f_Y;
                    [span_10](start_span)const singleAmp = sinc(envelopeX) * sinc(envelopeY);[span_10](end_span)

                    [span_11](start_span)// 2. 다중 격자 간섭 주 주기 위상 정의[span_11](end_span)
                    const phaseX = Math.PI * a * f_X;
                    const phaseY = Math.PI * a * f_Y;

                    if (mode === 'finite') {
                        // 2-A. [span_12](start_span)유한 격자 통합 방정식 (진폭 부호 완벽 보존)[span_12](end_span)
                        const interferenceX = Math.abs(Math.sin(phaseX)) < 1e-5 ? N : Math.sin(N * phaseX) / Math.sin(phaseX);
                        const interferenceY = Math.abs(Math.sin(phaseY)) < 1e-5 ? N : Math.sin(N * phaseY) / Math.sin(phaseY);
                        
                        [span_13](start_span)// N이 커져도 전체 에너지가 유실되거나 무늬가 작아지지 않도록 1/N 정규화 스케일 고정[span_13](end_span)
                        totalAmp = singleAmp * (interferenceX / N) * (interferenceY / N);
                        intensity = Math.pow(totalAmp, 2);

                    } else {
                        // 2-B. [span_14](start_span)[span_15](start_span)무한 격자 (T² 토러스 위상): 라우에 조건을 만족하는 불연속 도트 이산화[span_14](end_span)[span_15](end_span)
                        const unitX = (f_X * a);
                        const unitY = (f_Y * a);
                        
                        const deltaX = Math.abs(unitX - Math.round(unitX));
                        const deltaY = Math.abs(unitY - Math.round(unitY));
                        
                        [span_16](start_span)// 라우에 정수 지점(h,k) 주변에만 디락 델타 플럭스 형성[span_16](end_span)
                        if (deltaX < 0.05 && deltaY < 0.05) {
                            const peakX = Math.exp(-Math.pow(deltaX/0.02, 2));
                            const peakY = Math.exp(-Math.pow(deltaY/0.02, 2));
                            totalAmp = singleAmp * peakX * peakY;
                            intensity = Math.pow(totalAmp, 2);
                        } else {
                            totalAmp = 0;
                            intensity = 0;
                        }
                    }

                    [span_17](start_span)// 감마 보정 및 인텐시티 부스팅[span_17](end_span)
                    const brightness = Math.min(1, intensity * 2.5); 
                    
                    // 물리 기반 무지개 위상 컬러 매핑 함수 호출
                    const physicalColor = calculatePhysicalColor(totalAmp, phaseX, phaseY);

                    // 스크린 픽셀 최종 전사
                    const idx = (py * width + px) * 4;
                    imgData.data[idx] = Math.pow(brightness, 0.7) * physicalColor.r;     // R
                    imgData.data[idx + 1] = Math.pow(brightness, 0.7) * physicalColor.g; // G
                    imgData.data[idx + 2] = Math.pow(brightness, 0.7) * physicalColor.b; // B
                    imgData.data[idx + 3] = 255;                                        // Alpha
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // 초기 실행
        updateSimulation();
    </script>
</body>
</html>
