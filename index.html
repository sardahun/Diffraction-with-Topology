<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>정밀 2D 유한 격자 위상 및 간섭 스펙트럼 시뮬레이터</title>
    <style>
        body {
            margin: 0;
            background-color: #030303;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #controls {
            background: rgba(15, 15, 15, 0.95);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.7);
            display: flex;
            gap: 25px;
            align-items: center;
            margin-bottom: 15px;
            border: 1px solid #292929;
            z-index: 10;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00ffcc;
            font-weight: bold;
        }
        select, input {
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
        }
        input[type="range"] {
            padding: 0;
            width: 140px;
            accent-color: #00ffcc;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 255, 200, 0.15);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #222;
        }
        canvas {
            display: block;
            background: #000;
        }
    </style>
</head>
<body>

    <div id="controls">
        <div class="control-group">
            <label>격자 대형 수 (N x N): <span id="n-val">20</span></label>
            <input type="range" id="latticeN" min="2" max="100" value="20" step="1" oninput="updateSimulation()">
        </div>
        <div class="control-group">
            <label>격자 간격 (a)</label>
            <input type="range" id="latticeA" min="5" max="50" value="20" step="0.5" oninput="updateSimulation()">
        </div>
        <div class="control-group">
            <label>스펙트럼 감도 (Gain)</label>
            <input type="range" id="gain" min="0.5" max="5" value="2.5" step="0.1" oninput="updateSimulation()">
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="diffractionCanvas" width="700" height="700"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('diffractionCanvas');
        const ctx = canvas.getContext('2d');

        // 정밀한 회절 수식용 싱크 함수
        function sinc(x) {
            if (Math.abs(x) < 1e-8) return 1.0;
            return Math.sin(x) / x;
        }

        function updateSimulation() {
            const N = parseInt(document.getElementById('latticeN').value);
            const a = parseFloat(document.getElementById('latticeA').value);
            const gain = parseFloat(document.getElementById('gain').value);
            
            document.getElementById('n-val').innerText = `${N}x${N}`;

            const width = canvas.width;
            const height = canvas.height;
            const imgData = ctx.createImageData(width, height);
            
            // 격자 구멍 비율 고정
            const holeSize = 1.2; 

            // 복잡한 팩터 제거하고, 무늬가 촘촘히 꽉 차도록 캔버스 좌표 투사율을 0.05로 최적화 고정
            const scaleFactor = 0.05; 

            for (let py = 0; py < height; py++) {
                const fY = (py - height / 2) * scaleFactor; 

                for (let px = 0; px < width; px++) {
                    const fX = (px - width / 2) * scaleFactor;

                    // 1. 단일 슬릿 포발선 함수 (Envelope) - X, Y축 회절 곱하기
                    const factorX = Math.PI * holeSize * fX;
                    const factorY = Math.PI * holeSize * fY;
                    const envelope = Math.pow(sinc(factorX) * sinc(factorY), 2);

                    // 격자 간격(a)에 비례하여 위상 주기가 선명하게 변하도록 직결
                    const phaseX = Math.PI * a * fX * 0.2;
                    const phaseY = Math.PI * a * fY * 0.2;

                    // 2. 유한 격자 다중 슬릿 간섭 정밀식
                    const interX = Math.abs(Math.sin(phaseX)) < 1e-5 ? N : Math.sin(N * phaseX) / Math.sin(phaseX);
                    const interY = Math.abs(Math.sin(phaseY)) < 1e-5 ? N : Math.sin(N * phaseY) / Math.sin(phaseY);
                    
                    let totalIntensity = envelope * Math.pow((interX / N) * (interY / N), 2);

                    const idx = (py * width + px) * 4;

                    // [X, Y축 위상차를 R, G, B 채널에 매핑하여 알록달록한 위상 무늬 생성]
                    let r_comp = totalIntensity * (0.5 + 0.5 * Math.sin(phaseX));
                    let g_comp = totalIntensity * (0.5 + 0.5 * Math.cos(phaseY));
                    let b_comp = totalIntensity * (0.5 + 0.5 * Math.sin(phaseX + phaseY));

                    // 감도 및 가시성 보정
                    let r = Math.min(255, Math.pow(r_comp * gain, 0.7) * 255);
                    let g = Math.min(255, Math.pow(g_comp * gain, 0.7) * 255);
                    let b = Math.min(255, Math.pow(b_comp * gain, 0.7) * 255);

                    // 완전 상쇄 지점(Extinction 지점) 가시화용 배경광
                    if (totalIntensity < 0.003) {
                        r += 12; g += 9; b += 28; 
                    }

                    imgData.data[idx] = r;
                    imgData.data[idx + 1] = g;
                    imgData.data[idx + 2] = b;
                    imgData.data[idx + 3] = 255;
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        updateSimulation();
    </script>
</body>
</html>
